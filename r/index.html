<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Mondip Sen Verified Portfolio...</title>
<script>
  // Extract token from query params or URL path
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t') || window.location.pathname.split('/').filter(Boolean).pop() || 'direct';
  
  // Store referral token in client storage for portfolio viewer
  try {
    sessionStorage.setItem('recruiter_token', token);
    sessionStorage.setItem('visit_time', new Date().toISOString());
  } catch (e) {}

  // Pure Option B: Clean direct redirect (Zero Tailscale funnel dependencies)
  window.location.replace('../index.html?ref=' + encodeURIComponent(token));
</script>
</head>
<body style="font-family:system-ui,sans-serif; background:#0f172a; color:#f8fafc; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p style="font-size:16px;">Loading verified executive portfolio...</p>
</body>
</html>
