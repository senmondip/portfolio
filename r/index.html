<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Mondip Sen Verified Portfolio...</title>
<script>
  // Extract token from query params or URL path
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t') || window.location.pathname.split('/').filter(Boolean).pop() || 'direct_visitor';
  const ref = document.referrer || 'direct';
  
  // Store referral token in client session for portfolio viewer
  try {
    sessionStorage.setItem('recruiter_token', token);
    sessionStorage.setItem('recruiter_ref', ref);
    sessionStorage.setItem('visit_time', new Date().toISOString());
  } catch (e) {}

  // Tell the telemetry Worker this link was opened. sendBeacon survives the
  // navigation below; a plain fetch is cancelled by it, which is why earlier
  // attempts recorded nothing.
  try {
    const ping = 'https://resume-telemetry.mondipsen.workers.dev/c?t=' + encodeURIComponent(token)
      + '&r=' + encodeURIComponent(ref);
    if (!(navigator.sendBeacon && navigator.sendBeacon(ping))) {
      fetch(ping, { mode: 'no-cors', keepalive: true }).catch(() => {});
    }
  } catch (e) {}

  // Redirect to main portfolio viewer
  window.location.replace('../index.html?ref=' + encodeURIComponent(token));
</script>
</head>
<body style="font-family:system-ui,sans-serif; background:#0f172a; color:#f8fafc; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <h2 style="font-weight:600; margin-bottom:8px;">Mondip Sen — Solutions Engineering Portfolio</h2>
    <p style="color:#94a3b8; font-size:14px;">Redirecting to verified master resume & systems portfolio...</p>
  </div>
</body>
</html>
