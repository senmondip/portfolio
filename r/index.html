<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting to Mondip Sen Verified Portfolio...</title>
<script>
  // Extract token from query params or URL path
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t') || window.location.pathname.split('/').filter(Boolean).pop();
  
  // Telemetry ping to dashboard
  const ping = 'https://clawbox.comet-elver.ts.net/c?token=' + encodeURIComponent(token);
  // sendBeacon survives the navigation below; a plain fetch is cancelled by
  // it, which is why nothing was ever recorded.
  try {
    if (!(navigator.sendBeacon && navigator.sendBeacon(ping))) {
      fetch(ping, { mode: 'no-cors', keepalive: true }).catch(()=>{});
    }
  } catch (e) {
    try { fetch(ping, { mode: 'no-cors', keepalive: true }).catch(()=>{}); } catch (e2) {}
  }
  
  // Redirect to main resume viewer
  window.location.replace('../index.html?ref=' + encodeURIComponent(token));
</script>
</head>
<body>
  <p>Loading verified executive resume portfolio...</p>
</body>
</html>
