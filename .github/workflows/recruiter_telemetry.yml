name: Recruiter Telemetry Logger

on:
  repository_dispatch:
    types: [recruiter_view]
  workflow_dispatch:
    inputs:
      token:
        description: 'Recruiter / Job Tracking Token'
        required: true
        default: 'manual_test'
      referrer:
        description: 'Referrer URL / Platform'
        required: false
        default: 'direct'

jobs:
  log_view:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Telemetry Event
        run: |
          mkdir -p telemetry
          LOG_FILE="telemetry/recruiter_clicks.json"
          if [ ! -f "$LOG_FILE" ]; then
            echo "[]" > "$LOG_FILE"
          fi
          
          TOKEN="${{ github.event.client_payload.token || github.event.inputs.token }}"
          REF="${{ github.event.client_payload.referrer || github.event.inputs.referrer }}"
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          python3 -c "
          import json, os
          path = '$LOG_FILE'
          data = json.load(open(path)) if os.path.exists(path) else []
          data.append({
              'token': '$TOKEN',
              'referrer': '$REF',
              'timestamp': '$TIME'
          })
          json.dump(data, open(path, 'w'), indent=2)
          "

      - name: Commit and Push Log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry/recruiter_clicks.json
          git commit -m "telemetry: log recruiter visit [token: ${{ github.event.client_payload.token || github.event.inputs.token }}]" || exit 0
          git push origin main
